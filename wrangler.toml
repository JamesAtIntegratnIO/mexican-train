name = "mexican-train"
main = "worker/index.ts"
compatibility_date = "2025-04-01"

# Every request hits the Worker first so the security headers and /api routing
# apply; static files are then served through the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
# Minutes with nobody connected before an unstarted lobby is cleared.
EMPTY_GRACE_MIN = "15"
# The same, for a table with a game in it — long enough to sleep on, because
# people play this around work and dinner and bedtime.
EMPTY_GRACE_GAME_MIN = "720"
# Hours from creation before a table is cleared no matter what is happening.
# This is the one that keeps "nothing is kept" true.
MAX_LIFETIME_HOURS = "24"
# Player-to-player chat. Deliberately off: an ephemeral, unlogged room that
# anyone can mint and share by link is a private channel as much as it is a
# card table, and that is not a thing this deployment wants to host. The code
# is still here and still tested — set to "1" to bring it back.
CHAT_ENABLED = "0"
# error | warn | info | debug. debug logs a line per join, so keep it off here.
LOG_LEVEL = "info"
# Only needed if the app is served from a different host than the Worker.
# ALLOWED_ORIGINS = "mexicantrain.integratn.io"

# Minting a table costs a Durable Object, so it is throttled per IP: 5 a minute,
# matching the Node build's limiter. `period` only accepts 10 or 60.
[[ratelimits]]
name = "NEW_ROOM_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Funnel events cost a counter and nothing else, so they get their own budget
# rather than eating the one guarding table minting. A whole session sends a
# handful, so this is already generous — and it is deliberately not more
# generous than that, because on the free plan every event is also a data point
# against a daily allowance that no per-IP limit can bound on its own.
[[ratelimits]]
name = "EVENT_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Usage telemetry. Analytics Engine is written to rather than logged, so a data
# point per table costs nothing against the per-line logging bill — see
# worker/analytics.ts for the column layout, which is the query contract.
#
# The free plan includes 100,000 data points a day and keeps them for three
# months. A table costs one point and a whole session's funnel costs a handful,
# so ordinary play is nowhere near it; a flood of funnel events is the only way
# to get close. They are two datasets partly for that reason — dropping the
# FUNNEL binding sheds the noisy half and leaves the table rows, which are the
# ones worth having.
#
# Analytics Engine is included on the free plan but is OFF until enabled for the
# account, and a deploy that binds a dataset without it fails outright — error
# 10089, nothing published. `wrangler deploy --dry-run` does not catch it,
# because it never calls the API. Enable it once at
# dash.cloudflare.com → Workers → Analytics Engine.
#
# Both are optional to the code: delete these two blocks and everything else
# still deploys and runs, with no usage telemetry on this build.
[[analytics_engine_datasets]]
binding = "TABLES"
dataset = "mt_tables"

[[analytics_engine_datasets]]
binding = "FUNNEL"
dataset = "mt_funnel"

# Lets /api/health report which build answered, so a deploy can be confirmed.
[version_metadata]
binding = "CF_VERSION"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# SQLite-backed Durable Objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[observability]
enabled = true
