name: deploy

# The Worker — code, bindings, assets and Durable Object migrations — is
# deployed by wrangler. Terraform owns only the infrastructure around it (the
# hostname), and is applied by hand; it is deliberately not run here.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'server/**'
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time, and never cancel one midway — a half-applied Durable
# Object migration is not something to leave lying around.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The flake is the single source of truth for tool versions, so CI uses
      # exactly the wrangler the repo was developed against.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check the rules engine still holds
        run: nix develop --command node scripts/soak.mjs

      # No npm install: wrangler bundles worker/index.js and everything it
      # imports from server/. The only npm dependency (ws) belongs to the
      # standalone Node server, which is not deployed here.
      - name: Deploy
        run: nix develop --command wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Checked against workers.dev, not the custom domain: the zone in front of
      # mexicantrain.integratn.tech runs WAF rules that block non-browser clients,
      # so curl gets a 403 challenge page there regardless of Worker health.
      # Override with a HEALTH_URL repo variable if that ever changes.
      - name: Smoke test
        run: |
          url="${{ vars.HEALTH_URL || 'https://mexican-train.james-48c.workers.dev' }}/api/health"
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then echo "health OK: $(cat /tmp/health.json)"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying"; sleep 6
          done
          echo "::error::health check never returned 200 from $url"; exit 1
