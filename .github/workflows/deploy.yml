name: deploy

# The Worker — code, bindings, assets and Durable Object migrations — is
# deployed by wrangler. Terraform owns only the infrastructure around it (the
# hostname), and is applied by hand; it is deliberately not run here.
#
# No Nix here on purpose: installing it cost ~6 minutes per run, which is far
# more than this job is worth. The flake stays the source of truth for local
# development, and the wrangler version below used to be pinned to match it —
# see the note on WRANGLER_VERSION for why it no longer can be.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'public/**'
      - 'test/**'
      - 'scripts/soak.ts'
      - 'tsconfig*.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Deploying needs the code and nothing else. The default token is read/write.
permissions:
  contents: read

# One deploy at a time, and never cancel one midway — a half-applied Durable
# Object migration is not something to leave lying around.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # wrangler-action installs wrangler into this project's own tree, so the
  # version has to satisfy the peer graph package.json already has: wrangler
  # peer-depends on @cloudflare/workers-types, and only 4.108.0 and later ask
  # for the 5.x this project carries. Anything older is an ERESOLVE, which is
  # what took the deploy down from the TypeScript migration — the commit that
  # first pulled those types in — until someone read the log. So this has a
  # floor: bump it whenever @cloudflare/workers-types changes major, and keep
  # it in step with ci.yml.
  #
  # nixpkgs-unstable is on 4.93.0, so `nix develop` may hand you an older CLI
  # than this. That only affects local `wrangler dev`; nothing installs it here.
  WRANGLER_VERSION: '4.123.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # ci.yml runs these too, on the pull request. Repeated here on purpose:
      # main can be pushed to directly, and this is the last gate before the
      # thing is live.
      - name: Complexity gate
        run: npm run lint

      - name: Types
        run: npm run types

      # Also produces public/app.js, which the Worker serves through its assets
      # binding — deploying without this would ship an index.html whose script
      # tag resolves to nothing.
      - name: Build
        run: npm run build

      - name: Tests
        run: node --test dist/test/*.test.js

      - name: Check the rules engine still holds
        run: node dist/scripts/soak.js 3

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}

      # Checked against workers.dev, not the custom domain: the zone in front of
      # mexicantrain.integratn.tech runs WAF rules that block non-browser clients,
      # so curl gets a 403 challenge page there regardless of Worker health.
      # Override with a HEALTH_URL repo variable if that ever changes.
      - name: Smoke test
        run: |
          url="${{ vars.HEALTH_URL || 'https://mexican-train.james-48c.workers.dev' }}/api/health"
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then echo "health OK: $(cat /tmp/health.json)"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying"; sleep 6
          done
          echo "::error::health check never returned 200 from $url"; exit 1
