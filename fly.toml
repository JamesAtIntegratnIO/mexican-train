app = "mexican-train"
primary_region = "ord"

[build]

[env]
  PORT = "3000"
  # Minutes with nobody connected before a table is cleared (reconnect grace).
  EMPTY_GRACE_MIN = "15"
  # Minutes with no activity at all before a table is cleared.
  IDLE_MIN = "30"
  MAX_ROOMS = "500"
  # Set ALLOWED_ORIGINS only if the site is served from a different host than
  # this app. Left unset, same-origin requests are accepted and nothing else.

[http_service]
  internal_port = 3000
  force_https = true
  # Rooms live in this process's memory, so there must only ever be one machine.
  # Fly keeps a machine awake while WebSockets are attached; it suspends once the
  # last player disconnects, which is also when the tables are disposable anyway.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
